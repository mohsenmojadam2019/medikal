name: Android APK

on:
  push:
    branches: [main]
    paths: ['apk/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: |
          gradle testDebugUnitTest --stacktrace 2>&1 | tee test-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo '### Android test/build failure' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 180 test-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: medikal-android-debug
          path: apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
