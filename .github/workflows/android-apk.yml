name: Android APK

on:
  push:
    branches: [main]
    paths: ['apk/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: |
          gradle testDebugUnitTest --stacktrace 2>&1 | tee test-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo '### Android test/build failure' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 180 test-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Publish Gradle error annotation
        if: failure()
        run: |
          details=$(grep -E '(^e: |FAILURE:|What went wrong|Execution failed|Compilation error|Could not |error:|Caused by:)' test-build.log | tail -n 100 | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android Gradle failure::$details"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Package install ZIP
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk medikal.apk
          zip -j medikal-android-install.zip medikal.apk README.md
      - uses: actions/upload-artifact@v4
        with:
          name: medikal-android-debug
          path: |
            apk/app/build/outputs/apk/debug/app-debug.apk
            apk/medikal-android-install.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish install ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --target main --title "Medikal Android" --notes "نسخه قابل نصب اندروید مدیکال"
          gh release upload android-latest medikal-android-install.zip --clobber
